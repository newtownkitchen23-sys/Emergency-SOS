name: Node.js Demo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checks out your code
        uses: actions/checkout@v4

      - name: 2. Installs Node.js 20 with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Runs npm install at repo root
        run: npm install

      - name: 4. Runs npm install inside server/ only if it exists
        run: |
          if [ -d "server" ]; then
            cd server && npm install
          else
            echo "Server folder not found, skipping."
          fi

      - name: 5. Runs npm run build at root only if script exists
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found at root, skipping."
          fi

      - name: 6. Runs npm run build in server/ only if it exists
        run: |
          if [ -d "server" ] && [ -f "server/package.json" ]; then
            cd server
            if npm run | grep -q "build"; then
              npm run build
            fi
          else
            echo "No server build required, skipping."
          fi

      - name: 7. Prints green
        run: echo "✅ Success: All steps completed!"
