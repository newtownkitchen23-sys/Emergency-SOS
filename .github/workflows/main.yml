name: SOS_Emergency_Fix
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # This forces a fresh Gradle environment so it doesn't need your files
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Use 'gradle' instead of './gradlew' to avoid Error 127
      - name: Run Force Build
        run: gradle assembleDebug --no-daemon

      - name: Export APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-sos-demo
          path: "**/*.apk"
