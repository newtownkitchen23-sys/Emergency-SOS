name: Demo Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (Root)
        run: |
          if [ -f "package.json" ]; then
            npm install
          else
            echo "No package.json found in root, skipping..."
          fi

      - name: Install Dependencies (Server)
        run: |
          if [ -d "server" ] && [ -f "server/package.json" ]; then
            cd server && npm install
          else
            echo "No server folder found, skipping..."
          fi

      - name: Final Demo Check
        run: echo "✅ Successfully reached the end of the demo workflow!"
