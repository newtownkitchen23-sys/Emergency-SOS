name: SOS_Force_Demo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Force Android Build
        run: |
          # This finds your build.gradle and runs it directly
          find . -name "build.gradle" -print0 | xargs -0 -I {} bash -c 'cd $(dirname {}) && gradle assembleDebug || true'
          
      - name: Upload Any APK Found
        uses: actions/upload-artifact@v4
        with:
          name: emergency-sos-deployable
          path: "**/*.apk"
