name: SOS_Final_Download
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # This finds your project wherever it is hiding
      - name: Locate and Build
        run: |
          BUILD_PATH=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          PROJECT_ROOT=$(dirname "$BUILD_PATH")
          echo "Building in: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emergency-sos-apk
          path: "**/*.apk"
