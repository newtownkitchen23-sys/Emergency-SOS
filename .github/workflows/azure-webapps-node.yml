# This workflow will build a Node.js application and report the status.
# For more information see: https://github.com

name: Update main.yml

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install and Build
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "::warning title=Missing File::No package.json found in root. Skipping install/build."
          fi

      - name: Final Demo Check
        run: echo "🎉 Successfully reached the end of the demo workflow!"
