

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and Build
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "No package.json found, skipping install."
          fi

      - name: Final Demo Check
        run: echo "✅ Successfully reached the end of the demo workflow!"
