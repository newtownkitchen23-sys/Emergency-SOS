name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # 1. Find where the build.gradle file is
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No build.gradle found. Please ensure your code is uploaded."
            exit 1
          fi
          
          # 2. Move to that directory
          PROJECT_ROOT=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_ROOT"
          
          # 3. Use system gradle to build
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emergency-sos-app
          path: "**/*.apk"
